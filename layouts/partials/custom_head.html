<style>
  /* The theme gives every <code> 2px of padding, for inline code. Chroma wraps
     each highlighted line in a display:flex span, so that padding adds an empty
     line box and pushes the code one row below its line number. */
  pre code {
    padding: 0;
  }

  .book {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5em;
    align-items: flex-start;
    margin-bottom: 2.5em;
  }

  .book-cover {
    flex: none;
    width: 210px;
  }

  .book-cover img {
    display: block;
    height: 260px;
    width: auto;
  }

  .book-text {
    flex: 1 1 16em;
    min-width: 0;
  }

  .book-text > :first-child {
    margin-top: 0;
  }
</style>
